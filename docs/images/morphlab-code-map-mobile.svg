<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1060" viewBox="0 0 420 1060" role="img" aria-labelledby="title description">
<title id="title">MorphLab architecture: six connected parts</title>
<desc id="description">Studio sends media to the API. Live processing and offline export jobs use the model runtimes. Verification checks the pipeline. Solid arrows show processing; the dashed line shows a test relationship. Edited results return to Studio. This is a curated overview, not the complete dependency graph.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#244ce8"/></marker></defs>
<rect width="420" height="1060" rx="20" fill="#f5f6f8"/>
<text x="24" y="43" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f242c">MorphLab architecture</text>
<text x="24" y="74" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#525c6b">Six parts. One editing pipeline.</text>
<path d="M210 240 V274" fill="none" stroke="#244ce8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M112 402 V440" fill="none" stroke="#244ce8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M308 402 V440" fill="none" stroke="#244ce8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M112 564 V592 H160 V620" fill="none" stroke="#244ce8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M308 564 V592 H260 V620" fill="none" stroke="#244ce8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M210 776 V844" fill="none" stroke="#525c6b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 6"/>
<g id="studio"><rect x="24" y="112" width="372" height="128" rx="16" fill="#ffffff" stroke="#dde1e8"/>
<rect x="46" y="131" width="24" height="3" rx="1.5" fill="#244ce8"/>
<text x="46" y="164" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f242c">Studio</text>
<text x="46" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#525c6b">Camera · photos · video</text>
<text x="46" y="222" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#525c6b">frontend/src/</text>
</g>
<g id="api"><rect x="24" y="274" width="372" height="128" rx="16" fill="#ffffff" stroke="#dde1e8"/>
<rect x="46" y="293" width="24" height="3" rx="1.5" fill="#244ce8"/>
<text x="46" y="326" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f242c">API &amp; sessions</text>
<text x="46" y="352" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#525c6b">HTTP + WebSocket</text>
<text x="46" y="384" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#525c6b">studio_api.py</text>
</g>
<g id="live"><rect x="24" y="440" width="176" height="124" rx="16" fill="#ffffff" stroke="#dde1e8"/>
<rect x="42" y="459" width="24" height="3" rx="1.5" fill="#244ce8"/>
<text x="42" y="492" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f242c">Live</text>
<text x="42" y="518" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#525c6b">Face tracking</text>
<text x="42" y="546" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#525c6b">studio_live.py</text>
</g>
<g id="exports"><rect x="220" y="440" width="176" height="124" rx="16" fill="#ffffff" stroke="#dde1e8"/>
<rect x="238" y="459" width="24" height="3" rx="1.5" fill="#244ce8"/>
<text x="238" y="492" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f242c">Exports</text>
<text x="238" y="518" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#525c6b">Photos + video</text>
<text x="238" y="546" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#525c6b">studio_jobs.py</text>
</g>
<g id="models"><rect x="24" y="620" width="372" height="156" rx="16" fill="#ffffff" stroke="#dde1e8"/>
<rect x="46" y="639" width="24" height="3" rx="1.5" fill="#244ce8"/>
<text x="46" y="672" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f242c">Model runtimes</text>
<text x="46" y="698" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#525c6b">Live: MPS + CPU fallback</text>
<text x="46" y="722" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#525c6b">Exports: CoreML or CPU</text>
<text x="46" y="758" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#525c6b">runtime.py · mobile_model.py</text>
</g>
<g id="checks"><rect x="24" y="844" width="372" height="128" rx="16" fill="#ffffff" stroke="#dde1e8"/>
<rect x="46" y="863" width="24" height="3" rx="1.5" fill="#244ce8"/>
<text x="46" y="896" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f242c">Verification</text>
<text x="46" y="922" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#525c6b">Tests · comparisons · release gates</text>
<text x="46" y="954" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="400" fill="#525c6b">tests/ · scripts/ · CI</text>
</g>
<text x="24" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#525c6b">Arrows: processing flow</text>
<text x="24" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#525c6b">Dashed line: verification</text>
</svg>
